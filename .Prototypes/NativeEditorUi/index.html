<!DOCTYPE html>
<!-- SPDX-FileCopyrightText: 2026 CrankyAnt -->

<!--
  PROTOTYPE - throwaway UI concept exploration for the Scene patches editor interface.
  Three structurally different concepts on one route, switchable via ?variant=A|B|C
  (no parameter shows the comparison overview). All data is mocked and held in memory.
  Nothing here reads or changes a game, a save, a file or a mod. See ConceptNotes.md.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene patches UI concepts (prototype)</title>
<style>
:root{
  --bg:#1d1915; --bg2:#262019; --bg3:#14110e; --frame:#5c4b37; --rule:#4e493e;
  --tx:#beb5a3; --tx2:#8f8776; --hi:#e6dfcf; --sel:#d8d0bf; --selTx:#1d1915;
  --ok:#86cf6e; --warn:#e0a84a; --bad:#e2735c; --info:#7fb6c9; --concept:#b99ad6;
  --ui:"Montserrat","Segoe UI Variable Text","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --serif:"Libre Baskerville","Baskerville Old Face","Book Antiqua",Georgia,serif;
  --mono:"Cascadia Mono",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0d0b09;color:var(--tx);font:500 16px/1.3 var(--ui)}
button,input{font:inherit;color:inherit}
#root{position:absolute;inset:0;overflow:auto}
#root.fit{overflow:hidden}
#wrap{position:relative;margin:0 auto}
#stage{position:absolute;left:0;top:0;width:2560px;height:1440px;transform-origin:0 0;overflow:hidden;background:#333}
.world{position:absolute;inset:0;width:2560px;height:1440px}
.world [data-a]{cursor:pointer}
.vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 220px rgba(120,40,20,.35)}

/* ---- native-style primitives (shared vocabulary, not shared layout) ---- */
.win{position:absolute;background:var(--bg);border:2px solid var(--frame);border-radius:7px;box-shadow:0 6px 30px rgba(0,0,0,.55);display:flex;flex-direction:column;min-width:300px;min-height:120px;overflow:hidden}
.win.rs{resize:both}
.tb{flex:none;height:26px;line-height:24px;text-align:center;font-size:14px;color:var(--tx2);background:linear-gradient(#2c251d,#221c16);border-bottom:1px solid var(--rule);cursor:move;position:relative;user-select:none}
.tb .x{position:absolute;right:8px;top:0;cursor:pointer;font-size:17px}
.b{height:26px;padding:0 10px;border:1.5px solid #8a8170;border-radius:8px;background:#2a241d;color:var(--tx);cursor:pointer;white-space:nowrap;line-height:22px}
.b:hover{background:#3a3228;color:var(--hi)}
.b.pri{background:#cfc6b3;color:#1d1915;border-color:#e6dfcf;font-weight:600}
.b.pri:hover{background:#e6dfcf}
.b.on{background:var(--sel);color:var(--selTx)}
.b.dis{opacity:.42;cursor:not-allowed}
.b.dis:hover{background:#2a241d;color:var(--tx)}
.b.sm{height:22px;line-height:18px;font-size:14px;padding:0 8px}
.seg{display:inline-flex}
.seg .b{border-radius:0;margin-left:-1.5px}
.seg .b:first-child{border-radius:8px 0 0 8px;margin-left:0}
.seg .b:last-child{border-radius:0 8px 8px 0}
.cap{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2);font-weight:600;margin:10px 0 3px}
.cap i{font-style:normal;text-transform:none;letter-spacing:0;font-weight:400;margin-left:6px}
.ttl{font:700 21px/1.2 var(--serif);color:var(--hi)}
.sub{font-size:13px;color:var(--tx2);font-weight:400}
.in{height:26px;background:var(--bg3);border:1px solid #6d6556;border-radius:3px;padding:0 6px;width:100%;font-size:15px;color:var(--hi);font-variant-numeric:tabular-nums}
.in:focus{outline:1px solid var(--sel)}
.xyz{display:grid;grid-template-columns:14px 1fr 14px 1fr 14px 1fr;gap:4px;align-items:center;font-size:12px;color:var(--tx2)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.kv{display:grid;grid-template-columns:132px 1fr;gap:2px 10px;font-size:14.5px}
.kv dt{color:var(--tx2);font-weight:400}
.kv dd{margin:0;color:var(--hi);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:11px;font-size:12.5px;font-weight:600;border:1px solid var(--rule);color:var(--tx2);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:#44613a}
.chip.warn{color:var(--warn);border-color:#7a5c26}
.chip.bad{color:var(--bad);border-color:#7c3a2d}
.chip.info{color:var(--info);border-color:#3b5a66}
.chip.cpt{color:var(--concept);border-color:#5d4a70}
.chip[data-a]{cursor:pointer}
.i{display:inline-block;width:16px;height:16px;line-height:14px;text-align:center;border:1px solid var(--tx2);border-radius:50%;font-size:11px;color:var(--tx2);cursor:help;font-weight:600;text-transform:none;letter-spacing:0}
.msg{border-left:3px solid var(--info);background:#211d18;padding:6px 26px 6px 9px;font-size:14px;position:relative;line-height:1.35}
.msg b{font-weight:700;margin-right:4px}
.msg.ok{border-color:var(--ok)} .msg.ok b{color:var(--ok)}
.msg.refused{border-color:var(--warn)} .msg.refused b{color:var(--warn)}
.msg.failed{border-color:var(--bad)} .msg.failed b{color:var(--bad)}
.msg .b{margin:4px 4px 0 0}
.msg .mx{position:absolute;right:4px;top:2px;background:none;border:0;cursor:pointer;color:var(--tx2);font-size:16px}
.concept{border:1px dashed #5d4a70;color:var(--concept);font-size:12.5px;padding:5px 8px;border-radius:4px;margin:6px 0;line-height:1.35}
.concept.rep{border-color:#7a5c26;color:var(--warn)}
.pend{background:#2d2a1c;border:1px solid #7a6a2c;border-radius:5px;padding:7px 9px;font-size:14px}
.pend b{color:#f0d27a}
.hr{height:1px;background:var(--rule);margin:8px 0}
.list{overflow:auto}
.it{padding:3px 8px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;font-size:15px}
.it:hover{background:#2f2921}
.it.sel{background:var(--sel);color:var(--selTx)}
.it .nm{overflow:hidden;text-overflow:ellipsis;flex:1}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.grpH{padding:5px 8px 2px;font-size:14px;color:var(--tx2)}
.scroll{overflow:auto;min-height:0}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#6a6253;border-radius:5px}::-webkit-scrollbar-track{background:#191511}
.json{font:13px/1.35 var(--mono);white-space:pre;color:#a9a08e;background:var(--bg3);padding:8px;border-radius:3px;overflow:auto}
.ck{display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.ck s{width:16px;height:16px;border:1.5px solid #8a8170;border-radius:3px;display:inline-block;text-decoration:none;text-align:center;line-height:13px;font-size:13px;background:var(--bg3)}

/* ---- native Map Editor stand-in and HUD (surrounding product, same in all variants) ---- */
.hud{position:absolute;right:10px;top:6px;height:40px;padding:0 16px;border-radius:0 0 0 12px;background:#2a211a;border:2px solid var(--frame);display:flex;gap:18px;align-items:center;color:var(--tx2)}
.nat .pad{padding:6px 8px;display:flex;flex-direction:column;gap:6px}
.nat .ph{font-size:12px;color:#6f685b;text-align:center;padding:4px;border-top:1px solid var(--rule)}

/* ---- Variant A: outliner and inspector ---- */
.A-band{flex:none;display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--rule)}
.A-split{flex:1;display:flex;min-height:0}
.A-out{width:262px;flex:none;border-right:1px solid var(--rule);display:flex;flex-direction:column;padding:6px 0 0}
.A-out .top{padding:0 8px 6px;display:flex;flex-direction:column;gap:6px}
.A-insp{flex:1;display:flex;flex-direction:column;min-width:0}
.A-head{flex:none;padding:8px 10px 6px}
.A-tabs{flex:none;padding:0 10px 8px;border-bottom:1px solid var(--rule)}
.A-body{flex:1;padding:2px 10px 12px}
.A-gbar{flex:none;padding:8px 10px 0;border-top:1px solid var(--rule);background:#231e18;display:flex;flex-direction:column;gap:7px}
.A-foot{flex:none;border-top:1px solid var(--rule);background:#211c17;padding:8px 10px;display:flex;flex-direction:column;gap:7px}

/* ---- Variant B: world-anchored tools ---- */
.B-bar{position:absolute;left:760px;top:6px;width:1000px;height:42px;background:var(--bg);border:2px solid var(--frame);border-radius:0 0 10px 10px;display:flex;align-items:center;gap:8px;padding:0 10px}
.B-bar .nm{font:700 15px var(--serif);color:var(--hi);margin-right:4px}
.B-drop{position:absolute;top:48px;background:var(--bg);border:2px solid var(--frame);border-radius:6px;width:470px;max-height:420px;overflow:auto;box-shadow:0 6px 30px rgba(0,0,0,.55);padding:4px 0}
.B-card{width:432px;min-height:0}
.B-card .hd{padding:7px 10px 6px;cursor:move;border-bottom:1px solid var(--rule);position:relative}
.B-card .ops{padding:7px 10px;border-bottom:1px solid var(--rule)}
.B-card .tool{padding:2px 10px 10px}
.B-card .act{padding:8px 10px;border-top:1px solid var(--rule);background:#211c17;display:flex;flex-direction:column;gap:7px}
.B-prompt{position:absolute;left:830px;bottom:150px;width:900px;background:rgba(29,25,21,.95);border:2px solid #7a6a2c;border-radius:8px;padding:8px 12px;display:flex;gap:10px;align-items:center}
.B-cand{position:absolute;background:var(--bg);border:2px solid #f0d27a;border-radius:6px;padding:5px 8px;display:flex;gap:8px;align-items:center;font-size:14px;white-space:nowrap}

/* ---- Variant C: change sheet ---- */
.C-col{position:absolute;right:0;top:0;bottom:0;width:548px;background:var(--bg);border-left:2px solid var(--frame);display:flex;flex-direction:column;box-shadow:-6px 0 30px rgba(0,0,0,.5)}
.C-col.shut{width:58px;align-items:center;padding-top:10px;gap:10px;cursor:pointer}
.C-doc{flex:none;padding:10px 12px 8px;border-bottom:1px solid var(--rule)}
.C-tabs{flex:none;padding:8px 12px;border-bottom:1px solid var(--rule)}
.C-job{flex:none;border-bottom:2px solid var(--frame);background:#231e18;padding:9px 12px;display:flex;flex-direction:column;gap:7px;max-height:62%}
.C-steps{display:flex;gap:0;font-size:13px}
.C-steps span{flex:1;padding:3px 6px;border-bottom:3px solid var(--rule);color:var(--tx2)}
.C-steps span.cur{border-color:var(--sel);color:var(--hi);font-weight:700}
.C-steps span.done{border-color:#6f8a5f}
.C-body{flex:1;padding:6px 12px 14px}
.C-ent{border:1px solid var(--rule);border-radius:5px;padding:7px 9px;margin-top:7px;font-size:14.5px}
.C-ent .h{display:flex;gap:8px;align-items:center}
.C-ent .n{color:var(--tx2);font-variant-numeric:tabular-nums}
.C-ent.new{border-color:var(--sel)}
.C-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.C-grid .b{height:auto;min-height:44px;text-align:left;white-space:normal;line-height:1.2;padding:5px 9px}
.C-grid small{display:block;font-size:12px;color:var(--tx2);font-weight:400}
.diff{display:grid;grid-template-columns:120px 1fr 16px 1fr;gap:3px 6px;font-size:14px;align-items:baseline}
.diff .k{color:var(--tx2)} .diff .o{color:#a59c8b} .diff .nw{color:var(--hi);font-weight:600} .diff .same{grid-column:2/5;color:var(--tx2)}

/* ---- prototype chrome: deliberately not in the game's style ---- */
#bar{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:50;background:#fff;color:#111;border-radius:999px;box-shadow:0 4px 22px rgba(0,0,0,.6);display:flex;align-items:center;gap:6px;padding:5px 10px;font:600 13px "Segoe UI",Arial,sans-serif;white-space:nowrap;max-width:98vw;overflow:auto}
#bar button{font:inherit;border:1px solid #bbb;background:#f3f3f3;color:#111;border-radius:999px;padding:4px 10px;cursor:pointer}
#bar button:hover{background:#e2e2e2}
#bar button.on{background:#111;color:#fff;border-color:#111}
#bar .lab{min-width:238px;text-align:center}
#bar .tag{background:#c2185b;color:#fff;border-radius:999px;padding:3px 9px;font-size:11px;letter-spacing:.05em}
#bar .sepr{width:1px;height:20px;background:#ccc;margin:0 3px}
#bar small{font-weight:400;color:#555}
#dump{position:fixed;right:10px;bottom:58px;z-index:49;width:430px;max-height:60vh;overflow:auto;background:#fff;color:#111;font:12px/1.35 Consolas,monospace;white-space:pre-wrap;padding:10px;border-radius:8px;box-shadow:0 4px 22px rgba(0,0,0,.6)}
#tip{position:fixed;z-index:60;max-width:340px;background:#15120f;color:#e6dfcf;border:1px solid #8a8170;border-radius:5px;padding:6px 9px;font:400 13px/1.35 var(--ui);pointer-events:none;display:none;box-shadow:0 3px 14px rgba(0,0,0,.6)}

/* ---- overview page ---- */
.ov{max-width:1280px;margin:0 auto;padding:26px 22px 110px;font-size:15px;font-weight:400;line-height:1.45}
.ov h1{font:700 30px var(--serif);color:var(--hi);margin:0 0 4px}
.ov h2{font:700 20px var(--serif);color:var(--hi);margin:26px 0 8px}
.ov .proto{display:inline-block;background:#c2185b;color:#fff;font:700 12px "Segoe UI",Arial;letter-spacing:.06em;padding:3px 9px;border-radius:999px;vertical-align:middle;margin-left:10px}
.ov .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:14px}
.ov .card{background:var(--bg);border:2px solid var(--frame);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ov .card h3{font:700 19px var(--serif);color:var(--hi);margin:0}
.ov .card p{margin:0}
.ov .thumb{position:relative;aspect-ratio:16/9;border-radius:4px;overflow:hidden;background:linear-gradient(#6f97c7 0 38%,#55683c 38% 56%,#6a6157 56% 82%,#2a2520 82%);cursor:pointer}
.ov .thumb i{position:absolute;background:rgba(29,25,21,.94);border:1px solid #8a7558;border-radius:2px}
.ov .thumb i.n{background:rgba(29,25,21,.6);border-style:dashed}
.ov .thumb i.h{background:#d8d0bf}
.ov .thumb u{position:absolute;font:600 9px var(--ui);color:#e6dfcf;text-decoration:none}
.ov table{border-collapse:collapse;width:100%;font-size:14px}
.ov th,.ov td{border:1px solid var(--rule);padding:6px 8px;text-align:left;vertical-align:top}
.ov th{color:var(--hi);font-weight:600;background:var(--bg2)}
.ov td:first-child{color:var(--tx2);width:170px}
.ov ol{margin:6px 0;padding-left:22px}
.ov .note{border-left:3px solid var(--warn);padding:6px 10px;background:var(--bg);margin-top:10px}
@media(max-width:900px){.ov .cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<div id="bar"></div>
<div id="dump" hidden></div>
<div id="tip"></div>
<script>
'use strict';
/* PROTOTYPE: mock data and in-memory state only. Not production code. */

// ---------- mock map context ----------
const SEG = {
  Shuo:{y:830,x1:500,x2:1300,len:84.2,nodes:'N3f1 / N7ka'},
  Rm2c:{y:830,x1:1300,x2:2100,len:80.0,nodes:'N7ka / Nq02'},
  Sx4k:{y:905,x1:400,x2:1500,len:112.6,nodes:'Nb81 / Nc44'},
  Tq9a:{y:990,x1:700,x2:1900,len:121.9,nodes:'Nd10 / Ne93'}
};
// task status per family:
//   1   = present in the reference snapshot, ticket closed (not independently verified by this prototype)
//   'r' = controls exist in the reference snapshot, but the capability is not yet accepted (#45 open)
//   'p' = planned (concept only); absent = not applicable
const FAM = {
  marker:{l:'Track marker',t:{place:1,bind:'r',activity:1},
    na:{}},
  board:{l:'Board',t:{place:1,activity:1},spec:{l:'Terrain output',st:1},
    na:{bind:'Independent boards have no supported logical binding.'}},
  milepost:{l:'Milepost',t:{place:'p',bind:'p',activity:'p'},spec:{l:'Milepost',st:'p',ref:'#48'},na:{}},
  crossing:{l:'Existing crossing',t:{},spec:{l:'Crossing',st:'p',ref:'#53-#56'},
    na:{place:'A crossing is corrected through coverage, detection and equipment, not moved as one object.',bind:'Crossing relationships are edited under Crossing.',activity:'Not offered for crossings.'}},
  pad:{l:'Crossing pad',t:{place:'p'},spec:{l:'Pad geometry',st:'p',ref:'#51'},
    na:{bind:'A pad has no logical binding of its own.',activity:'Not offered for pads.'}},
  bridge:{l:'Bridge',t:{place:1,activity:1},spec:{l:'Collision limits',st:1},
    na:{bind:'Bridges have no supported logical binding.'}}
};
const TASKL = {place:'Placement',bind:'Binding',activity:'Activity'};
function mkObjects(){ return [
  {id:'wse',name:'Whistle Sign E',fam:'marker',path:'World/Roads Sylva/Crossing Unprotected - Allen (1)/Whistle Sign E',active:true,
   pos:[25201.15,622.73,-778.08],rot:[359.69,20.65,0],binding:{seg:'Shuo',end:'a',dist:58.69},reg:'Registered with Shuo',wx:1120,wy:770,
   deps:['Parent: Crossing Unprotected - Allen (1)','Track segment Shuo (logical binding)'],problems:[]},
  {id:'wsw',name:'Whistle Sign W',fam:'marker',path:'World/Roads Sylva/Crossing Unprotected - Allen (1)/Whistle Sign W',active:true,
   pos:[25145.02,622.61,-777.40],rot:[0.2,200.4,0],binding:{seg:'Kd7x',end:'b',dist:12.5},reg:'Not registered',wx:560,wy:775,
   deps:['Parent: Crossing Unprotected - Allen (1)','Track segment Kd7x (missing)'],problems:['Bound segment Kd7x is not in the loaded map context. The marker is not registered with any track.']},
  {id:'mp47',name:'Milepost 47',fam:'milepost',path:'World/Mileposts/MP 47',active:true,
   pos:[25171.3,622.7,-777.9],rot:[0,90,0],binding:{seg:'Tq9a',end:'a',dist:12.0},reg:'Registered with Tq9a',wx:820,wy:780,
   deps:['Track segment Tq9a (logical binding)','Model and value: concrete post, "47"'],problems:[],check:'Binding is valid, but the bound segment Tq9a is two tracks away from the post. Valid does not mean intended.'},
  {id:'brd',name:'Loc: Sylva Int',fam:'board',path:'World/Signs/Loc: Sylva Int',active:true,
   pos:[25245.9,623.4,-783.2],rot:[0,181.5,0],binding:null,reg:'Independent',wx:1560,wy:730,out:1,
   deps:['Terrain output: 1 mask'],problems:[]},
  {id:'spd',name:'Speed 25 Sylva Yard',fam:'marker',path:'World/Signs/Speed 25 Sylva Yard',active:false,
   pos:[25122.4,622.5,-774.9],rot:[0,18.0,0],binding:{seg:'Sx4k',end:'a',dist:4.1},reg:'Registered with Sx4k (inactive)',wx:330,wy:800,
   deps:['Track segment Sx4k (logical binding)'],problems:[]},
  {id:'xing',name:'Main St crossing',fam:'crossing',path:'World/Roads Sylva/Crossing Protected - Main St',active:true,
   pos:[25229.0,622.6,-790.0],rot:[0,90,0],binding:null,reg:'Covers Shuo, Sx4k',wx:1400,wy:860,
   deps:['Covered tracks: Shuo, Sx4k','Equipment: 2 lights, 1 bell','Pad: Main St pad 2'],problems:[],check:'Track Tq9a passes through the crossing but is not covered.'},
  {id:'pad',name:'Main St pad 2',fam:'pad',path:'World/Roads Sylva/Crossing Protected - Main St/Pad 2',active:true,
   pos:[25229.0,622.6,-797.5],rot:[0,90,0],binding:null,reg:'Part of Main St crossing',wx:1400,wy:975,
   deps:['Parent: Main St crossing','Generated geometry'],problems:[]},
  {id:'brg',name:'Tuckasegee deck girder',fam:'bridge',path:'World/Bridges/Tuckasegee Deck Girder',active:true,
   pos:[25304.6,618.9,-795.1],rot:[0,90.5,0],binding:null,reg:'Independent',wx:2150,wy:985,
   deps:['Collision volume: deck and abutments'],problems:[]}
].map(o=>Object.assign(o,{pos0:o.pos.slice(),wx0:o.wx,wy0:o.wy})); }

// ---------- shared state (one conceptual state behind all three concepts) ----------
let S;
function reset(){
  S={view:S?S.view:'overview',fit:S?S.fit:true,objs:mkObjects(),sel:null,stale:false,failNext:false,pending:null,gizmo:null,
     draft:{},hist:[],redo:[],seq:0,saved:'',attempts:[],msg:null,dump:false,win:{},
     ui:{aTab:'sum',aGuide:false,aFilter:'all',q:'',bTool:null,bDrop:null,bData:false,cTab:'work',cOpen:true,job:null,cNew:null}};
}
reset();
const $=s=>document.querySelector(s);
const h=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ob=id=>S.objs.find(o=>o.id===id);
const cur=()=>S.sel?ob(S.sel):null;
const st=(o,t)=>FAM[o.fam].t[t];
const usable=x=>x===1||x==='r';
const mark=x=>x==='p'?' ◦':x==='r'?' ◇':'';
const markTip=x=>x==='p'?'Planned capability, shown as concept.':x==='r'?'Controls exist in the source snapshot, but this capability is not yet accepted (#45 open). The flow here is mocked.':'';
const PLANNED='Planned capability. Shown as concept only.';
const naWhy=(o,t)=>FAM[o.fam].na[t]||'Not applicable to this object family.';
const f2=n=>(+n).toFixed(2);
const sig=()=>S.hist.map(e=>e.n).join(',');
const dirty=()=>sig()!==S.saved;
const unsaved=()=>{const sv=S.saved?S.saved.split(','):[];return S.hist.filter(e=>!sv.includes(String(e.n))).length+sv.filter(n=>!S.hist.some(e=>String(e.n)===n)).length;};
const changed=o=>S.hist.some(e=>e.id===o.id);
const problems=()=>S.objs.filter(o=>o.problems.length);
const checks=()=>S.objs.filter(o=>o.check);
function D(o){ return S.draft[o.id]||(S.draft[o.id]=freshDraft(o)); }
function freshDraft(o){ return {x:f2(o.pos[0]),y:f2(o.pos[1]),z:f2(o.pos[2]),rx:f2(o.rot[0]),ry:f2(o.rot[1]),rz:f2(o.rot[2]),
  seg:o.binding?o.binding.seg:'',end:o.binding?o.binding.end:'a',dist:o.binding?f2(o.binding.dist):'0.00',snap:null}; }
function placeChanged(o){const d=D(o),f=freshDraft(o);return ['x','y','z','rx','ry','rz'].some(k=>+d[k]!==+f[k]);}
function bindChanged(o){const d=D(o),b=o.binding;return !b||d.seg!==b.seg||d.end!==b.end||+d.dist!==+b.dist;}
function pin(o,p){p=p||o.pos;return {x:o.wx0+(p[0]-o.pos0[0])*14,y:o.wy0-(p[2]-o.pos0[2])*8};}
function draftPin(o){const d=D(o);return pin(o,[+d.x||0,0,+d.z||0]);}
function bindPt(b){const s=SEG[b.seg];if(!s)return null;const px=Math.min(+b.dist*9.5,s.x2-s.x1);return {x:b.end==='a'?s.x1+px:s.x2-px,y:s.y};}
const bindTxt=b=>b?`${b.seg} · end ${b.end} · ${f2(b.dist)} m`:'None (independent)';
const posTxt=p=>p.map(f2).join(', ');

// ---------- actions (mocked; nothing leaves this page) ----------
function why(kind){ const o=cur(); if(!o) return 'Select an object first.'; const d=D(o);
  if(S.pending) return 'Finish or cancel the pending world choice first.';
  if(kind==='place'){ if(!usable(st(o,'place'))) return st(o,'place')==='p'?PLANNED:naWhy(o,'place');
    return placeChanged(o)?'':'Nothing to apply: the draft equals the inspected placement.'; }
  if(kind==='bind'){ if(!usable(st(o,'bind'))) return st(o,'bind')==='p'?PLANNED:naWhy(o,'bind');
    if(!d.seg) return 'Choose a segment in the world or type its ID first.';
    if(!SEG[d.seg]) return 'Segment "'+d.seg+'" is not in the loaded map context.';
    return bindChanged(o)?'':'Nothing to apply: the draft equals the current binding.'; }
  if(kind==='detach'){ if(!usable(st(o,'bind'))) return st(o,'bind')==='p'?PLANNED:naWhy(o,'bind'); return o.binding?'':'This object has no binding to detach.'; }
  if(kind==='active') return usable(st(o,'activity'))?'':(st(o,'activity')==='p'?PLANNED:naWhy(o,'activity'));
  return ''; }
function apply(kind){ const o=cur(); if(!o||why(kind)) return false; const d=D(o); let label,patch,okText;
  if(kind==='place'){ const v=['x','y','z','rx','ry','rz'].map(k=>parseFloat(d[k]));
    if(v.some(isNaN)){ S.msg={t:'refused',text:'Placement needs six numbers with a decimal point. Nothing was changed.'}; return false; }
    label=(d.snap?'Snap to '+d.snap:'Move')+' · '+o.name; patch={pos:v.slice(0,3),rot:v.slice(3)};
    okText='Placement applied'+(d.snap?' (snapped once to '+d.snap+')':'')+'. Logical binding unchanged. Observation refreshed.'; }
  if(kind==='bind'){ label='Set binding · '+o.name; patch={binding:{seg:d.seg,end:d.end,dist:parseFloat(d.dist)||0},reg:'Registered with '+d.seg};
    okText='Binding set to '+bindTxt(patch.binding)+'. The object was not moved. Observation refreshed.'; }
  if(kind==='detach'){ label='Detach from track · '+o.name; patch={binding:null,reg:'Not registered'}; okText='Detached from track. The object was not moved. Observation refreshed.'; }
  if(kind==='active'){ label=(o.active?'Disable':'Enable')+' · '+o.name; patch={active:!o.active}; okText='Object '+(o.active?'disabled':'enabled')+'. Placement and binding unchanged.'; }
  if(S.stale){ S.msg={t:'refused',rec:'refresh',text:label+': the inspected target changed since the last refresh. Nothing was changed. Your draft is kept.'};
    S.attempts.push({n:++S.seq,id:o.id,label,state:'refused',kind}); return false; }
  if(S.failNext){ S.failNext=false; S.msg={t:'failed',rec:'retry',kind,text:label+': the dependent registration update failed. The previous state was restored and verified.'};
    S.attempts.push({n:++S.seq,id:o.id,label,state:'failed',kind}); return false; }
  const before={}; for(const k in patch) before[k]=JSON.parse(JSON.stringify(o[k]));
  S.hist.push({n:++S.seq,id:o.id,label,kind,before,after:JSON.parse(JSON.stringify(patch))}); S.redo=[];
  Object.assign(o,JSON.parse(JSON.stringify(patch))); if(kind==='bind'||kind==='detach') fixProblems(o);
  S.draft[o.id]=freshDraft(o); S.gizmo=null; S.msg={t:'ok',text:okText}; S.ui.cNew=S.seq; return true; }
function fixProblems(o){ o.problems=o.binding&&!SEG[o.binding.seg]?['Bound segment '+o.binding.seg+' is not in the loaded map context. The marker is not registered with any track.']:[]; }
function setObj(e,which){ const o=ob(e.id); Object.assign(o,JSON.parse(JSON.stringify(e[which]))); fixProblems(o); S.draft[o.id]=freshDraft(o); }
const ACT={
  sel(id){ if(S.pending) return; const j=S.ui.job;
    if(j&&j.target){ if(id!==j.target) S.msg={t:'info',text:'The open job is pinned to '+ob(j.target).name+'. The selection was not changed. Go back to Target or cancel the job to work on another object.'}; return; }
    if(j&&j.home==='A'){ if(j.step===4) S.ui.job=null; }   // guided mode in A: at Target or after Apply the selection is free
    else if(j){ const w=jobOk(j.type,ob(id)); if(w) S.msg={t:'info',text:ob(id).name+' cannot take this job. '+w}; else ACT.jobSel(id); return; }
    S.sel=id; S.msg=null; S.gizmo=null; S.ui.bDrop=null; delete S.win.Bcard; const o=ob(id);
    if(S.ui.aTab!=='sum'&&S.ui.aTab!=='id'){ const ok=S.ui.aTab==='spec'?FAM[o.fam].spec:st(o,S.ui.aTab); if(!ok) S.ui.aTab='sum'; }
    if(S.ui.bTool&&S.ui.bTool!=='spec'&&!st(o,S.ui.bTool)) S.ui.bTool=null; if(S.ui.bTool==='spec'&&!FAM[o.fam].spec) S.ui.bTool=null; },
  desel(){ if(!S.pending&&!(S.ui.job&&S.ui.job.target)){ if(S.ui.job&&S.ui.job.step===4) S.ui.job=null; S.sel=null; S.gizmo=null; S.msg=null; } },
  choose(kind){ S.pending={kind,cand:null}; S.gizmo=null; S.msg=null; },
  cand(seg){ if(S.pending) S.pending.cand=seg; },
  confirm(){ const p=S.pending,o=cur(); if(!p||!p.cand||!o) return; const d=D(o),s=SEG[p.cand];
    if(p.kind==='bind'){ d.seg=p.cand; S.msg={t:'info',text:'Segment '+p.cand+' confirmed as draft. Nothing is changed until you set the binding.'}; }
    else { const pp=pin(o), ax=Math.max(s.x1,Math.min(s.x2,pp.x)), ay=s.y-55;
      d.x=f2(o.pos0[0]+(ax-o.wx0)/14); d.z=f2(o.pos0[2]-(ay-o.wy0)/8); d.snap=p.cand;
      S.msg={t:'info',text:'Snap preview on '+p.cand+'. Position changes once on apply; rotation and binding stay.'}; }
    S.pending=null; },
  cancel(){ S.pending=null; S.msg={t:'info',text:'Choice cancelled. Nothing was changed.'}; },
  apply(kind){ apply(kind); },
  // Inside a task, Retry takes the same completion transition as Apply, so the task ends after one applied change.
  retry(){ const k=S.msg&&S.msg.kind, j=S.ui.job; S.msg=null; if(!k) return; if(j&&j.target) ACT.jobApply(); else apply(k); },
  refresh(){ S.stale=false; S.msg={t:'info',text:'Inventory refreshed and the target inspected again. Draft values were kept; apply again when ready.'}; },
  dismiss(){ S.msg=null; },
  revert(){ const o=cur(); if(o){ S.draft[o.id]=freshDraft(o); S.gizmo=null; } },
  gizmo(m){ S.gizmo=S.gizmo===m?null:m; },
  nudge(v){ const o=cur(),d=D(o),[k,a]=v.split(':'); d[k]=f2((+d[k]||0)+(+a)); d.snap=null; },
  end(v){ D(cur()).end=v; },
  gen(){ const o=cur(); o.out=0; o.deps=['Terrain output: current']; S.msg={t:'ok',text:'Terrain output generated for '+o.name+'.'}; },
  undo(){ const e=S.hist.pop(); if(!e) return; setObj(e,'before'); S.redo.push(e); S.msg={t:'info',text:'Native Undo: '+e.label+'. Observation refreshed.'+jobReset(e)}; },
  redo(){ const e=S.redo.pop(); if(!e) return; setObj(e,'after'); S.hist.push(e); S.msg={t:'info',text:'Native Redo: '+e.label+'. Observation refreshed.'+jobReset(e)}; },
  save(){ S.saved=sig(); S.msg={t:'ok',text:'Saved by the native editor: patch document and map written.'+(S.objs.some(o=>o.out)?' Terrain output still outstanding for 1 board.':'')}; },
  focus(){ S.msg={t:'info',text:'Camera focused on '+cur().name+' (not mocked: the backdrop is a still illustration).'}; },
  nomock(v){ S.msg={t:'info',text:v+' is not mocked in this prototype.'}; },
  // prototype harness
  view(v){ setView(v); }, fit(){ S.fit=!S.fit; }, dump(){ S.dump=!S.dump; },
  stale(){ S.stale=true; }, fail(){ S.failNext=!S.failNext; }, reset(){ reset(); },
  // variant-local UI state
  aTab(v){ S.ui.aTab=v; }, aFilter(v){ S.ui.aFilter=v; },
  bTool(v){ S.ui.bTool=S.ui.bTool===v?null:v; S.gizmo=null; }, bDrop(v){ S.ui.bDrop=S.ui.bDrop===v?null:v; }, bData(){ S.ui.bData=!S.ui.bData; },
  cTab(v){ S.ui.cTab=v; }, cOpen(){ S.ui.cOpen=!S.ui.cOpen; },
  // A job pins its target and owns that target's draft: it starts from the inspected scene values,
  // and cancelling, returning to Target or leaving Concept C discards the draft.
  job(t){ startJob(t,'C'); },
  // Guided mode in A: the same job state and rules, hosted in the inspector pane.
  guide(t){ S.ui.aGuide=true; startJob(t,'A'); },
  guideMore(){ S.ui.job=null; S.msg=null; },
  aMode(v){ const j=S.ui.job; if(v==='guided'){ S.ui.aGuide=true; return; }
    S.ui.aGuide=false; if(!j) return; if(j.step===4){ S.ui.job=null; return; }
    ACT.jobCancel(); S.msg={t:'info',text:'Guided task cancelled. Its values were discarded; nothing was changed.'}; },
  jobSel(id){ const j=S.ui.job; S.sel=id; j.target=id; S.draft[id]=freshDraft(ob(id)); S.msg=null; j.step=JOBS[j.type].values?2:3; },
  jobStep(n){ const j=S.ui.job; n=+n;
    if(n>=2&&!j.target){ const o=cur(); if(o&&jobOk(j.type,o)==='') ACT.jobSel(o.id); return; }   // leaving Target pins the target
    j.step=n; if(j.step===2&&!JOBS[j.type].values) j.step=1; if(j.step===1) jobDrop(j); },
  jobCancel(){ jobDrop(S.ui.job); S.ui.job=null; S.msg=null; },
  jobApply(){ const j=S.ui.job; S.sel=j.target; if(!apply(JOBS[j.type].kind)) return;
    if(j.home==='A') S.ui.job={type:j.type,step:4,target:null,home:'A',done:S.hist[S.hist.length-1].label}; else { S.ui.job=null; S.ui.cTab='changes'; } },
  repair(id){ S.sel=id; ACT.job('bind'); }
};
function jobDrop(j){ if(j.target) S.draft[j.target]=freshDraft(ob(j.target)); j.target=null; S.pending=null; S.gizmo=null; }
function jobReset(e){ const j=S.ui.job; if(!j||j.target!==e.id) return ''; S.pending=null; S.gizmo=null; if(JOBS[j.type].values) j.step=2; return ' The open job was reset to the new scene values.'; }
function startJob(t,home){ S.ui.job={type:t,step:1,target:null,home}; S.msg=null; S.pending=null; S.gizmo=null; if(S.sel&&jobOk(t,cur())==='') ACT.jobSel(S.sel); }
function setView(v){ const j=S.ui.job; if(j&&v!==j.home){ if(j.step===4) S.ui.job=null;
    else { ACT.jobCancel(); S.msg={t:'info',text:'The task that was open was cancelled when you left that concept. Its values were discarded; nothing was changed.'}; } }
  S.view=v; }

function variantA(){ const o=cur(), ui=S.ui, list=filtered(ui.q,ui.aFilter); const groups={}; list.forEach(x=>(groups[x.fam]=groups[x.fam]||[]).push(x));
  const modeSw=g=>`<span class="seg" style="flex:none">${btn('Inspector','aMode','insp',{on:!g,sm:1,tip:g?'Return to the normal inspector. An unfinished guided task is cancelled and its values are discarded.':'Tabs with every control for this object.'})}${btn('Guided','aMode','guided',{on:g,sm:1,tip:'Do one task step by step: Target, Values, Review, Apply.'})}</span>`;

  else { const sp=FAM[o.fam].spec, tab=ui.aTab;
    const tabBtn=(k,l,status,whyNot)=>btn(l+mark(status),'aTab',k,{on:tab===k,dis:status?'':whyNot,tip:markTip(status)});

        +(o.problems.length&&usable(st(o,'bind'))?`<div class="row" style="margin-top:8px">${btn('Fix step by step','guide','bind',{tip:'Opens Guided mode on this problem: confirm the target, choose the track, review, apply. You can also fix it yourself on the Binding tab.'})}</div>`:'');
      foot=`<div class="row">${btn('Focus camera','focus')}${st(o,'place')?btn('Edit placement','aTab','place'):''}${st(o,'bind')?btn(o.problems.length?'Repair binding':'Edit binding','aTab','bind',{pri:!!o.problems.length}):''}</div>`; }
    if(tab==='place'){ body=statusNote(o,'place')+fragPose(o)+fragGizmoSnap(o)+`<div class="cap">Activity</div>`+fragActivity(o);
      foot=`<div class="row"><span class="sub">${placeChanged(o)?'Draft differs from the scene. Binding will not change.':'Draft equals the scene.'}</span><span class="sp"></span>${btn('Revert','revert',null,{dis:placeChanged(o)?'':'No draft to revert.'})}${btn('Apply placement','apply','place',{pri:1,dis:why('place'),tip:'Applies position and rotation, then refreshes the observation.'})}</div>`; }
    if(tab==='bind'){ body=statusNote(o,'bind')+`<div class="cap">Current ${info('A logical binding relates this object to a track. It is independent of where the object stands.')}</div>${fragBindNow(o)}<div class="hr"></div><div class="cap" style="color:var(--hi)">Change to</div>${fragBindDraft(o)}<div class="hr"></div>${fragFollow()}`;
      foot=`<div class="row"><span class="sub">${bindChanged(o)&&D(o).seg?'Draft differs. The object will not move.':''}</span><span class="sp"></span>${btn('Detach','apply','detach',{dis:why('detach'),tip:'Removes the relationship; the object stays where it is.'})}${btn(o.binding?'Replace binding':'Set binding','apply','bind',{pri:1,dis:why('bind')})}</div>`; }
    if(tab==='spec'){ body=fragSpec(o); foot=''; }
    if(tab==='id'){ body=fragIdentity(o); foot=''; }
    if(S.pending) foot=pendHtml(true);
    insp=`<div class="A-head"><div class="row" style="flex-wrap:nowrap;align-items:flex-start"><div class="ttl" style="flex:1">${h(o.name)}</div>${modeSw(false)}</div><div class="row" style="margin-top:5px;gap:4px">${badges(o)}</div></div>
    <div class="A-tabs"><span class="seg">${tabBtn('sum','Summary',1)}${tabBtn('place','Placement',st(o,'place'),naWhy(o,'place'))}${tabBtn('bind','Binding',st(o,'bind'),naWhy(o,'bind'))}${tabBtn('spec',sp?sp.l:'Special',sp?sp.st:0,'This family has no specialized operations.')}${tabBtn('id','Identity',1)}</span></div>

     <div class="list scroll" data-sc="A-list" style="flex:1">${Object.keys(groups).map(f=>`<div class="grpH">▾ ${FAM[f].l}</div>`+groups[f].map(x=>itemRow(x)).join('')).join('')||'<div class="sub" style="padding:10px">No objects match.</div>'}</div></div>

// Guided mode of A: an optional step-by-step region that replaces only the tabs, body and footer of the
// inspector pane. Window, band, outliner and object heading stay as they are. Back and Next move only these steps.
const GUIDE=['bind','detach','move','snap','active'];
function guidedA(o,sw){ const j=S.ui.job, back=btn('‹ Inspector','aMode','insp',{sm:1,tip:j&&j.step<4?'Return to the normal inspector. This cancels the guided task and discards its values; nothing was changed.':'Return to the normal inspector.'});
  const head=`<div class="A-head"><div class="row" style="flex-wrap:nowrap;align-items:flex-start"><div class="ttl" style="flex:1">${o?h(o.name):'<span style="color:var(--tx2)">No object</span>'}</div>${sw}</div>${o?`<div class="row" style="margin-top:5px;gap:4px">${badges(o)}</div>`:''}</div>`;
  if(!j){ const fix=o.problems.length&&jobOk('bind',o)==='';

    <div class="A-body scroll" data-sc="A-guide"><p class="sub" style="margin:10px 0 6px">Each task takes four steps: Target, Values, Review, Apply. Nothing changes before Apply.</p>
    ${fix?`<div class="msg failed" style="margin-bottom:8px"><b>Problem.</b>${h(o.problems[0])}<br>${btn('Fix this binding ◇','guide','bind',{pri:1,sm:1,tip:markTip('r')})}</div>`:''}
    <div class="C-grid">${GUIDE.map(k=>{ const w=jobOk(k,o); return btn(`${JOBS[k].l}<small>${h(w||JOBS[k].d)}</small>`,'guide',k,{dis:w}); }).join('')}</div></div>
    ${S.msg?`<div class="A-foot">${msgHtml()}</div>`:''}`; }
  const J=JOBS[j.type], n=j.step, okT=o?jobOk(j.type,o):'Pick an object in the list or the world.', pend=S.pending?'Finish or cancel the pending world choice first.':'';
  let b='', foot='';
  if(n===1) b=`<div class="cap">Target</div>`+(o?`<dl class="kv"><dt>Object</dt><dd>${h(o.name)}</dd><dt>Family</dt><dd>${FAM[o.fam].l}</dd><dt>Scene path</dt><dd class="mono">${h(o.path)}</dd><dt>Binding</dt><dd>${h(bindTxt(o.binding))}</dd></dl>`
      +(o.problems.length?`<div class="cap" style="color:var(--bad)">Problem</div><div>${h(o.problems[0])}</div>`:'')
      +`<p class="sub">${okT?'This object cannot take the task. '+h(okT):'Next pins this object as the target of the task.'} To use another object, pick it in the list or the world.</p>`
      :`<p class="sub">Pick an object in the list or the world.</p>`);
  else if(n<4) b=statusNote(o,J.task)+`<div class="cap">${n===2?'Values':'Review'} ${n===3?info('Left is the inspected scene, right is what Apply will write. Lines marked unchanged are not touched.'):''}</div>`+jobStepBody(j,o);
  else b=`<div class="msg ok" style="margin-top:10px;padding-right:9px"><b>Applied.</b>${h(j.done)}. The observation was refreshed.</div>
    <dl class="kv" style="margin-top:10px"><dt>Placement</dt><dd>${posTxt(o.pos)}</dd><dt>Binding</dt><dd>${h(bindTxt(o.binding))}</dd><dt>Registration</dt><dd>${h(o.reg)}</dd><dt>Active</dt><dd>${o.active?'Yes':'No'}</dd></dl>
    <p class="sub">${dirty()?unsaved()+' unsaved. Save and Undo are in the native Map Editor window.':'Saved.'}</p>`;
  if(n<4) foot=`<div class="row">${n>1?btn('Back','jobStep',n-1,{dis:pend,tip:n===2||!J.values?'Back to Target. This unpins the target and discards the entered values.':'Back to Values. The entered values are kept.'}):''}<span class="sp"></span>${
      n===1?btn('Next','jobStep',2,{pri:1,dis:okT,tip:'Pins the target and continues.'})
      :n===2?btn('Next','jobStep',3,{pri:1,dis:pend,tip:'Review the change before anything is applied.'})
      :btn('Apply','jobApply',null,{pri:1,dis:why(J.kind),tip:'One coherent operation: applied, verified, then the observation is refreshed.'})}</div>`;
  else foot=`<div class="row">${btn('Another guided task','guideMore')}<span class="sp"></span>${btn('Back to inspector','aMode','insp',{pri:1})}</div>`;
  const steps=['Target',J.values?'Values':'Values (none)','Review','Apply'];
  return head+`<div class="A-gbar"><div class="row">${back}<span class="cap" style="margin:0">Guided</span><b style="color:var(--hi)">${J.l}</b><span class="sp"></span>${j.target?`<span class="chip info" data-tip="This task is pinned to its target. Selecting another object does not change it. Go back to Target to pick a different one; that discards the entered values.">Target pinned</span>`:''}</div>
    <div class="C-steps">${steps.map((l,i)=>`<span class="${i+1===n?'cur':i+1<n?'done':''}">${i+1} ${l}</span>`).join('')}</div></div>
    <div class="A-body scroll" data-sc="A-guide">${b}</div>
    <div class="A-foot">${n<4?msgHtml():''}${foot}</div>`; }

  <li>Move it: nudge with the gizmo arrows or snap to a track, then apply. The binding must not change.</li><li>Press <b>Make stale</b> in the prototype bar, then apply something. Find the refusal and recover.</li>
  <li>Toggle <b>Fail next</b> and apply. Find the failure and retry.</li><li>Undo and Redo in the native Map Editor stand-in, then Save. Watch the unsaved state.</li>
  <li>In A, select <b>Whistle Sign W</b> (problem) and press <b>Fix step by step</b>: Target, Values, Review, Apply. Try selecting another object midway, Back, and returning to the Inspector.</li><li>Select <b>Whistle Sign W</b> (problem),<b>Main St crossing</b> and <b>Milepost 47</b> (planned capabilities, concept only).</li></ol>
  <div class="note">The reported panel slowness is investigated separately and its cause is not yet attributed. This page does not measure, diagnose or fix game performance, and no layout here is a remedy for it. The concepts only keep data scrolling and action controls in separate regions.</div>
  <p class="sub">Keys: ← → switch concepts (not while typing). Esc cancels a pending world choice. The white bar at the bottom is prototype chrome, not part of any design.</p></div>`; }

// ---------- render loop ----------
function scale(){ return S.fit?Math.min(innerWidth/2560,innerHeight/1440):1; }
function render(){ const root=$('#root');
  const ae=document.activeElement, fk=ae&&ae.dataset?ae.dataset.k:null, cs=fk?[ae.selectionStart,ae.selectionEnd]:null;
  const sc={}; root.querySelectorAll('[data-sc]').forEach(e=>sc[e.dataset.sc]=e.scrollTop);
  root.querySelectorAll('.rs[data-win]').forEach(e=>{ const w=S.win[e.dataset.win]=S.win[e.dataset.win]||{}; w.w=e.offsetWidth; w.h=e.offsetHeight; });
  if(S.view==='overview'){ root.className=''; root.innerHTML=overview(); }
  else { const k=scale(); root.className=S.fit?'fit':'';
    root.innerHTML=`<div id="wrap" style="width:${2560*k}px;height:${1440*k}px"><div id="stage" style="transform:scale(${k})">${world({candInWorld:S.view==='B'})}${nativeEditor()}${VAR[S.view].f()}</div></div>`; }
  root.querySelectorAll('[data-sc]').forEach(e=>{ if(sc[e.dataset.sc]) e.scrollTop=sc[e.dataset.sc]; });
  if(fk){ const e=root.querySelector(`[data-k="${fk}"]`); if(e){ e.focus(); try{ e.setSelectionRange(cs[0],cs[1]); }catch(_){} } }
  const v=S.view, on=v!=='overview';
  $('#bar').innerHTML=`<span class="tag">PROTOTYPE</span><button data-a="prev">←</button><span class="lab">${on?v+' · '+VAR[v].n:'Overview'}</span><button data-a="next">→</button>
    <button data-a="view" data-v="overview" class="${on?'':'on'}">Overview</button>${on?`<span class="sepr"></span><button data-a="fit" title="Fit shows the whole 2560 × 1440 game screen. 1:1 shows true size with scrolling.">${S.fit?'Fit':'1:1'}</button>
    <span class="sepr"></span><small>Scenario</small><button data-a="stale" class="${S.stale?'on':''}" title="Simulate a native edit that makes the inspected target stale.">Make stale</button><button data-a="fail" class="${S.failNext?'on':''}" title="The next apply fails and is restored.">Fail next</button><button data-a="reset">Reset</button><button data-a="dump" class="${S.dump?'on':''}">State</button>`:''}`;
  const dp=$('#dump'); dp.hidden=!(S.dump&&on); if(!dp.hidden){ const o=cur(); dp.textContent=JSON.stringify({variant:v,task:S.ui.job,guidedMode:S.ui.aGuide,selected:o?o.name:null,stale:S.stale,failNext:S.failNext,pending:S.pending,gizmo:S.gizmo,draft:o?D(o):null,
    scene:o?{pos:o.pos,rot:o.rot,binding:o.binding,registration:o.reg,active:o.active}:null,history:S.hist.map(e=>'#'+e.n+' '+e.label),redo:S.redo.map(e=>'#'+e.n+' '+e.label),attempts:S.attempts.map(e=>'#'+e.n+' '+e.state+' '+e.label),dirty:dirty(),message:S.msg},null,1); }
  try{ const u=new URL(location.href); if(on) u.searchParams.set('variant',v); else u.searchParams.delete('variant'); history.replaceState(null,'',u); }catch(_){}
}
function cycle(d){ const ks=Object.keys(VAR), i=ks.indexOf(S.view); setView(ks[(i<0?(d>0?0:ks.length-1):i+d+ks.length)%ks.length]); }
document.addEventListener('click',e=>{ const t=e.target.closest('[data-a]'); if(!t||t.classList.contains('dis')) return;
  const a=t.dataset.a; if(a==='x') return; if(a==='prev') cycle(-1); else if(a==='next') cycle(1); else if(ACT[a]) ACT[a](t.dataset.v);
  $('#tip').style.display='none'; render(); });
document.addEventListener('input',e=>{ const t=e.target; if(t.dataset.q){ S.ui.q=t.value; S.ui.bDrop=null; render(); }
  else if(t.dataset.in&&cur()){ const d=D(cur()); d[t.dataset.in]=t.value; if('xyz'.includes(t.dataset.in)&&t.dataset.in.length===1) d.snap=null; } });
document.addEventListener('change',e=>{ if(e.target.dataset.in) render(); });
document.addEventListener('keydown',e=>{ const t=e.target, typing=t.matches&&t.matches('input,textarea,select,[contenteditable]');
  if(e.key==='Escape'&&S.pending){ ACT.cancel(); render(); return; }
  if(e.key==='Enter'&&typing&&t.dataset.in){ t.blur(); return; }
  if(typing) return; if(e.key==='ArrowLeft'){ cycle(-1); render(); } if(e.key==='ArrowRight'){ cycle(1); render(); } });
// drag windows by their title bar (positions are per-session only)
let drag=null;
document.addEventListener('pointerdown',e=>{ const hd=e.target.closest('[data-drag]'); if(!hd||e.target.closest('[data-a]')) return; const w=hd.closest('.win');
  drag={id:hd.dataset.drag,el:w,x:e.clientX,y:e.clientY,l:w.offsetLeft,t:w.offsetTop}; e.preventDefault(); });
document.addEventListener('pointermove',e=>{ if(drag){ const k=scale(), x=drag.l+(e.clientX-drag.x)/k, y=drag.t+(e.clientY-drag.y)/k; drag.el.style.left=x+'px'; drag.el.style.top=y+'px';
    const w=S.win[drag.id]=S.win[drag.id]||{}; w.x=x; w.y=y; return; }
  const t=e.target.closest&&e.target.closest('[data-tip]'), tip=$('#tip'); if(t&&t.dataset.tip){ tip.textContent=t.dataset.tip; tip.style.display='block';
    tip.style.left=Math.min(e.clientX+14,innerWidth-350)+'px'; tip.style.top=(e.clientY+18+tip.offsetHeight>innerHeight?e.clientY-tip.offsetHeight-10:e.clientY+18)+'px'; } else tip.style.display='none'; });
document.addEventListener('pointerup',()=>{ if(drag){ drag=null; render(); } });
addEventListener('resize',render);
{ const v=(new URLSearchParams(location.search).get('variant')||'').toUpperCase(); S.view=VAR[v]?v:'overview'; }
render();
</script>
